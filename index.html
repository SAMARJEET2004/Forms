<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up Form</title>
  <link href="style.css" rel="stylesheet" >
</head>
<body>
  <div class="side-panel">
    <img src ="hayley-murray-vXHWALVnXUo-unsplash.jpg" class="background">
    <div class="odin-wrapper">
      <img src="odin-lined.png" class="odin-logo">
      <p class="odin-text">ODIN</p>
    </div>
    <div class="footer">
      Photo by <a href="https://unsplash.com/@hayleymurrayphoto"> Hayley   Murray </a> on <a href="https://unsplash.com/"> Unsplash </a>
    </div>
  </div>
  <div class="main">
    <div class="intro">
      <div >
        This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <em>now</em> to get started.
      </div>
      <p>You <em>know</em> you want to.</p>
    </div>
    <form action="https://formspree.io/f/meajljzn" method="POST" id ="myForm">
      <legend>Let's do this!</legend>
      <div class="input-group">
        <div><label for="first_name">First Name<em>*</em></label>
        <input id="first_name" name="first_name" type="text" required></div>
        <div><label for="last_name">Last Name<em>*</em></label>
        <input id="last_name" name="last_name" type="text" required></div>
        <div><label for="email">Email</label>
        <input id="email" name="email" type="email" ></div>
        <div><label for="phone_num">Phone Number</label>
        <input id="phone_num" name="phone_num" type="tel" ></div>
        <div><label for="password">Password<em>*</em></label>
        <input id="password"  name="password" type="password" required></div>
        <div><label for="confirm_password">Confirm Password<em>*</em></label>
        <input id="confirm_password" name="confirm_password" type="password" required></div>
      </div>
    </form>
    <div class="submission">
      <button form="myForm" type="submit" >Create Account</button>
      <div>Already have an account<a href=""> Log in </a></div>
    </div>
  </div>
</body>
</html>
